name: 'Vite PR Coverage Insight'
description: 'Compare coverage between main and PR, post result to PR comment'
inputs:
  github-token:
    required: true
    description: 'GitHub token for PR comment'
  mode:
    required: false
    description: "'report' (default) posts the PR comment; 'baseline' publishes coverage to the baseline store on main-branch pushes"
    default: 'report'
  base:
    required: false
    description: 'Path to base coverage-summary.json (optional since v2 — omit to auto-resolve from the baseline store)'
  head:
    required: false
    description: 'Path to PR coverage-summary.json, or a directory of shard summaries to merge'
  coverage:
    required: false
    description: "Path to coverage-summary.json for 'baseline' mode (falls back to 'head')"
  baseline-branch:
    required: false
    description: 'Orphan branch used as the baseline/history store'
    default: 'coverage-baseline'
  ai:
    required: false
    description: "AI assistance: 'off' (default, zero non-GitHub network calls), 'comment' (risk analysis + test suggestions), 'review' (adds advisory verdict)"
    default: 'off'
  ai-can-block:
    required: false
    description: "Only with ai: 'review' — allow a high-risk AI verdict to set the check run to neutral"
    default: 'false'
  run-script:
    required: false
    description: 'Shell command to run tests with coverage before reading the coverage file (e.g. npm run test:coverage). On a non-zero exit the report still posts: failed test names are parsed from the output (vitest/jest), the comment enters the tests-failed state and the job is marked failed so the PR cannot merge.'
  test-failures:
    required: false
    description: 'Path to test failures JSON file'
  use-check-run:
    required: false
    description: 'Whether to use GitHub Check Run API'
    default: 'false'
  annotations:
    required: false
    description: "Diff annotations published via the check run: 'all' (default), 'coverage' (uncovered lines in touched files), 'failed-tests', or 'none'"
    default: 'all'
runs:
  using: 'node24'
  main: 'dist/index.js'
