name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm run test:coverage

      - run: npm run build

      - name: Ensure committed bundle is up to date
        run: git diff --exit-code dist/index.js || (echo "::error::dist/index.js is stale — run 'npm run build' and commit the result" && exit 1)

  dogfood:
    name: Post fixture coverage comment (e2e)
    # fork PRs get a read-only GITHUB_TOKEN, so the comment post would silently no-op
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run this action against fixture data
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base: fixtures/regression/base.json
          head: fixtures/regression/head.json
          test-failures: fixtures/test-failures/failures.json

      - name: Upload coverage report artifacts (D6)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage-report.json
            coverage-report.html
          if-no-files-found: warn
