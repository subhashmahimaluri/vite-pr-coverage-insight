version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # ESM-only majors break the ncc CJS bundle (dist/index.js) with a
      # runtime "Cannot find module" stub — see packages/action/test/distSmoke.test.ts
      - dependency-name: '@actions/github'
        update-types: ['version-update:semver-major']
      - dependency-name: '@actions/cache'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
